<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo - Home</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <!-- 메인 히어로 배너 시작 - 박혜정 -->
      <section class="main-hero">
        <img
          class="main-hero__image"
          src="./images/main-hero.png"
          alt="검은 기둥이 바다에 서 있는 영화 이미지"
        />
        <div class="main-hero__content">
          <p class="main-hero__weekly">이번 주의 발견 <span>VOL. 01</span></p>
          <h1 class="main-hero__title">고요의 궤도</h1>
          <p class="main-hero__sub-title">QUIET ORBIT</p>
          <p class="main-hero__time">
            <span>2026</span>
            <span>SF·미스터리</span>
            <span>15+</span>
            <span>1시간 48분</span>
          </p>
          <p class="main-hero__intro">
            모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막
            관측자는 그 고요 속으로 한 걸음 다가선다.
          </p>
          <div class="main-hero__actions">
            <a href="#" class="main-hero__button1">작품 살펴보기</a>
            <button type="button" class="main-hero__button2">찜하기</button>
          </div>
        </div>
        <p class="main-hero__caption">
          고요가 시작되는 곳, 이야기가 깨어난다.
          <small>A CINEMO ORIGINAL CONCEPT</small>
        </p>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
