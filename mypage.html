<!doctype html>

          계정 설정
        </h2>
        <dl class="account-settings__list">
          <div class="account-settings__row">
            <dt class="account-settings__label">
              이메일
            </dt>
            <dd class="account-settings__value">
              yolo202617@example.com
            </dd>
            <dd class="account-settings__control">
              <button type="button" class="account-settings__action">
                변경
              </button>
            </dd>
          </div>
          <div class="account-settings__row">
            <dt class="account-settings__label">
              비밀번호
            </dt>
            <dd class="account-settings__value">
              ••••••••••••
            </dd>
            <dd class="account-settings__control">

          </div>

              멤버십

            </dd>
            <dd class="account-settings__control">
              <button type="button" class="account-settings__action">

              </button>  
            </dd>
          </div>
          <div class="account-settings__row">
            <dt class="account-settings__label">
              표시 언어
            </dt>
            <dd class="account-settings__value">
              한국어
            </dd>
            <dd class="account-settings__control">
              <button type="button" class="account-settings__action">
                변경
              </button>  
            </dd>
          </div>             
        </dl>
        <div class="account-settings__bottom">
          <p class="account-settings__notice">
            내 계정으로 접속 중입니다.
          </p>
          <button type="button" class="account-settings__logout">
            로그아웃
          </button>
        </div>
      </section>
    <!--계정 설정 끝 - 김동민-->

    <footer></footer>
