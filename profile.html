<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo - Profile</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-logo" href="./index.html">
          <span class="site-logo-mark" aria-hidden="true"></span>
          CINEMO
        </a>
      </div>
    </header>

    <main class="profile-main">
      <section class="profile-intro">
        <span class="profile-intro-top">YOUR OWN SCENE</span>
        <h2 class="profile-intro-middle">누구의 시간인가요?</h2>
        <p class="profile-intro-bottom">
          함께 보는 이야기, 취향은 각자의 방식으로.
        </p>
      </section>

      <!-- 프로필 선택 리스트 시작 -->
      <section class="profile-selection">
        <ul class="profile-list">
          <li class="profile-card">
            <a href="./mypage.html">
              <div id="yolo" class="image-profile">
                <span class="profile-initials">Y</span>
                <div class="circle circle-top"></div>
                <div class="circle circle-bottom"></div>
                <div class="dot"></div>
              </div>
              <div class="profile-info">
                <span class="profile-name">욜로</span>
                <p class="profile-bio">나만의 영화 노트</p>
              </div>
            </a>
          </li>
          <li class="profile-card">
            <a href="#">
              <div id="jiho" class="image-profile">
                <span class="profile-initials">J</span>
                <div class="circle circle-top"></div>
                <div class="circle circle-bottom"></div>
                <div class="dot"></div>
              </div>
              <div class="profile-info">
                <span class="profile-name">지호</span>
                <p class="profile-bio">새로운 장면을 찾아서</p>
              </div>
            </a>
          </li>
          <li class="profile-card">
            <a href="#">
              <div id="min" class="image-profile">
                <span class="profile-initials">M</span>
                <div class="circle circle-top"></div>
                <div class="circle circle-bottom"></div>
                <div class="dot"></div>
              </div>
              <div class="profile-info">
                <span class="profile-name">민</span>
                <p class="profile-bio">새로운 장면을 찾아서</p>
              </div>
            </a>
          </li>
          <li class="profile-card">
            <a href="#">
              <div id="guest" class="image-profile">
                <span class="profile-initials">G</span>
                <div class="circle circle-top"></div>
                <div class="circle circle-bottom"></div>
                <div class="dot"></div>
              </div>
              <div class="profile-info">
                <span class="profile-name">게스트</span>
                <p class="profile-bio">새로운 장면을 찾아서</p>
              </div>
            </a>
          </li>
        </ul>
      </section>
      <!-- 프로필 선택 리스트 끝 -->

      <a type="button" class="profile-button" href="#">
        <svg
          width="17"
          height="17"
          viewBox="0 0 17 17"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10.6009 3.10006L10.606 3.10524M10.606 3.10524L13.5961 6.095M10.606 3.10524L12.242 1.46912C12.6385 1.0727 13.1764 0.850027 13.7371 0.850098C14.2979 0.850168 14.8356 1.07297 15.2321 1.4695C15.6286 1.86602 15.8513 2.40379 15.8512 2.96449C15.8511 3.52519 15.6283 4.0629 15.2317 4.45932L13.5961 6.095M10.606 3.10524L2.23157 11.4807C2.05742 11.6543 1.92863 11.8681 1.85654 12.1032L0.865703 15.3671C0.846317 15.432 0.844853 15.5009 0.861466 15.5665C0.878078 15.6321 0.912147 15.692 0.960058 15.7399C1.00797 15.7877 1.06794 15.8217 1.1336 15.8382C1.19925 15.8547 1.26816 15.8531 1.33299 15.8336L4.59804 14.8436C4.83293 14.7722 5.04671 14.6442 5.22059 14.4709L13.5961 6.095M13.5961 6.095L13.6011 6.10001"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke="#F3F1ED"
          />
        </svg>
        <span class="text-profile-button">프로필 관리</span>
      </a>
    </main>
    <footer class="profile-footer">
      <p class="footer-text">당신의 다음 장면을 만나는 곳, CINEMO</p>
    </footer>
  </body>
</html>
